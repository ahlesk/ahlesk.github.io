<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #0b0b0b; --text: #e6e6e6; --muted: #9a9a9a; --accent: #6b9a1f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: center; }
    h1 { font-size: clamp(64px, 14vw, 120px); margin: 0; color: var(--accent); }
    p { color: var(--muted); margin: 8px 0 32px; }
    a { display: inline-block; border: 1px solid var(--accent); color: var(--accent); padding: 14px 28px;
      text-decoration: none; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; transition: background .3s, color .3s; }
    a:hover { background: var(--accent); color: #0e1405; }
    .caret { animation: b 1s steps(1) infinite; } @keyframes b { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>&gt; página não encontrada<span class="caret">_</span></p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
